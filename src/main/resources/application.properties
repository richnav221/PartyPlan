spring.application.name=ProyectoWeb

# Base de datos PostgreSQL (se puede sobreescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/partyplan}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Origen permitido para el frontend Angular
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Jackson: los campos primitivos ausentes en el JSON toman su valor por defecto
spring.jackson.deserialization.fail-on-null-for-primitives=false
