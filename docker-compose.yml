services:
  postgres:
    image: postgres:16-alpine
    container_name: partyplan-db
    environment:
      POSTGRES_DB: partyplan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - partyplan-data:/var/lib/postgresql/data

volumes:
  partyplan-data:
